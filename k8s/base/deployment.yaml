apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultsearch
    spec:
      serviceAccountName: vaultsearch
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultsearch
          image: ghcr.io/meherwerali/vaultsearch:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vaultsearch-config
            - secretRef:
                name: vaultsearch-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: vaultsearch-vault
            readOnly: true
        - name: tmp
          emptyDir: {}
