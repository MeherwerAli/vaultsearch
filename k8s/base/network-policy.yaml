apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultsearch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vaultsearch
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 9200
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
