name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify application and integration tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s/base | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary
